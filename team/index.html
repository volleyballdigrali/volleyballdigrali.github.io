<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volleyball Team</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Team">
<!-- "black": the iPhone keeps its own solid strip for the time and battery, and the page starts below it (some iPhones report the strip as 0 high, which put the header under the clock). -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#17181b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- The volleyball intro (shared with the Volleyball Digrali page): plays first, before the password. Once per launch; tap to skip; off with Reduce Motion. -->
<script src="../intro.js?v=1.14"></script>
<header class="top">
  <div class="top-in">
    <a class="home-link" id="home-link" href="../" hidden>‹ Home menu</a>
    <img class="club-logo" id="club-logo" alt="" hidden>
    <div class="brand">Team <span class="ver" id="ver">v1.14</span></div>
    <div class="team-name" id="team-name"></div>
  </div>
</header>

<main id="main" class="main"><p class="muted">Loading…</p></main>

<nav class="tabbar" aria-label="Main">
  <button type="button" data-tab="serve"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4.5 9.5c4 1 11 1 15 0M6 17c3-3 9-3 12 0"/></svg>Serve</button>
  <button type="button" data-tab="receive"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 14l7 6 7-6"/><path d="M12 20V4"/></svg>Receive</button>
  <button type="button" data-tab="attack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v17M21 4v17"/><rect x="3" y="5" width="18" height="7"/><path d="M7.5 5v7M12 5v7M16.5 5v7M3 8.5h18"/></svg>Net Play</button>
  <button type="button" data-tab="schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Schedule</button>
  <button type="button" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
</nav>

<div class="update" id="update" hidden>
  <span id="update-text">New version available</span>
  <button type="button" class="btn small primary" id="update-btn">Update</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
